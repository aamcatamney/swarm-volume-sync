# Local single-node run for development and smoke-testing the agent + control API.
#
# This is NOT the production deployment. swarm-volume-sync is a Swarm *global*
# service; real multi-node replication requires Swarm (overlay DNS for peer
# discovery, one task per node). For production use the stack file:
#     docker stack deploy -c deploy/stack.yml svs
#
# Here there is a single agent and no peers, so nothing replicates across nodes —
# but the agent runs, detects local sources via the Docker socket, versions
# volumes, and serves the control API, which is enough to develop and smoke-test.
#
# 1. Generate the SSH keypair the agent expects:
#      mkdir -p deploy/secrets
#      ssh-keygen -t ed25519 -N "" -f deploy/secrets/svs_ssh_key
#      mv deploy/secrets/svs_ssh_key.pub deploy/secrets/svs_ssh_pubkey
# 2. Run:
#      docker compose up --build
# 3. Try it:
#      curl localhost:8080/healthz
#      docker volume create --label swarm-volume-sync.enable=true appdata
#      curl localhost:8080/status

services:
  agent:
    build: .
    image: swarm-volume-sync:latest
    ports:
      - "8080:8080" # control API: /healthz, /status, /metrics, /volumes
    environment:
      SVS_SERVICE_NAME: swarm-volume-sync # no overlay DNS locally => single-node, no peers
      SVS_SYNC_MODE: labelled
      SVS_ENABLE_LABEL: swarm-volume-sync.enable
      SVS_IGNORE_LABEL: swarm-volume-sync.ignore
      SVS_SSH_KEY_PATH: /root/.ssh/id_svs
      SVS_METADATA_DIR: /var/lib/swarm-volume-sync
      SVS_VOLUMES_ROOT: /var/lib/docker/volumes
      SVS_CONTROL_API_PORT: "8080"
      SVS_DEBOUNCE_SECONDS: "5"
      SVS_SAFETY_POLL_SECONDS: "300"
      SVS_RETENTION_DAYS: "7"
    volumes:
      # Detect local mounts/volumes and own node identity.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read/write actual volume data for rsync.
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      # Persist version metadata across restarts.
      - svs-metadata:/var/lib/swarm-volume-sync
    secrets:
      - svs_ssh_key
      - svs_ssh_pubkey

volumes:
  svs-metadata:

secrets:
  svs_ssh_key:
    file: ./deploy/secrets/svs_ssh_key
  svs_ssh_pubkey:
    file: ./deploy/secrets/svs_ssh_pubkey
