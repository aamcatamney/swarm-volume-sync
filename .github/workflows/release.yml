name: Release

# CalVer release-on-merge (ADR-0004). Every push to main that touches the image
# (src / Dockerfile / project files) mints a CalVer release YYYY.M.MICRO: tests,
# computes the version, builds + pushes a multi-arch image to GHCR with the
# version baked in, then creates the matching tag + GitHub Release.
#
# One workflow on purpose: a tag pushed by GITHUB_TOKEN does not trigger a
# second workflow, so a "tag here, build on tag" split would silently never
# build. Computing the version here also lets it be injected at build time.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "*.slnx"
      - "**/*.csproj"
  workflow_dispatch:

# Serialize releases so two pushes can't race on the next-MICRO computation.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run unit tests
        run: dotnet test --configuration Release

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tag + GitHub Release
      packages: write # push image to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to compute the next MICRO

      - name: Compute CalVer (YYYY.M.MICRO)
        id: ver
        run: |
          set -euo pipefail
          ym="$(date -u +%Y.%-m)"                       # e.g. 2026.6 (no leading-zero month)
          last="$(git tag --list "${ym}.*" \
                  | sed "s/^${ym}\.//" \
                  | grep -E '^[0-9]+$' \
                  | sort -n | tail -1 || true)"
          if [ -z "${last}" ]; then micro=0; else micro=$((last + 1)); fi
          version="${ym}.${micro}"
          echo "version=${version}"        >> "$GITHUB_OUTPUT"
          echo "major_minor=${ym}"         >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.short_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          notes="$(cat <<EOF
          \`\`\`sh
          docker pull ${REGISTRY}/${IMAGE_NAME}:${version}
          \`\`\`

          Image digest: \`${{ steps.build.outputs.digest }}\`
          EOF
          )"
          gh release create "${version}" \
            --target "${GITHUB_SHA}" \
            --title "${version}" \
            --notes "${notes}" \
            --generate-notes
