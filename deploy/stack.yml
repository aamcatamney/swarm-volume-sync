# Deploy with:  docker stack deploy -c deploy/stack.yml svs
# (stack name "svs" => service "svs_agent" => overlay DNS "tasks.svs_agent")
version: "3.8"

services:
  agent:
    # Published by CI; override with your own build/registry if you prefer.
    image: ghcr.io/aamcatamney/swarm-volume-sync:latest
    # Global => exactly one agent task per node, which is what full-mesh needs.
    deploy:
      mode: global
      restart_policy:
        condition: any
    ports:
      # host mode: each node serves its own agent's control API on :8080
      - target: 8080
        published: 8080
        mode: host
    environment:
      # Must equal "<stack>_<service>" so tasks.<name> resolves the full mesh.
      SVS_SERVICE_NAME: svs_agent
      # labelled (opt-in, default) | all
      SVS_SYNC_MODE: labelled
      SVS_ENABLE_LABEL: swarm-volume-sync.enable
      SVS_IGNORE_LABEL: swarm-volume-sync.ignore
      SVS_SSH_KEY_PATH: /root/.ssh/id_svs
      SVS_METADATA_DIR: /var/lib/swarm-volume-sync
      SVS_VOLUMES_ROOT: /var/lib/docker/volumes
      SVS_CONTROL_API_PORT: "8080"
      # change-driven: coalesce a burst of writes, then sync; safety-net catches missed events
      SVS_DEBOUNCE_SECONDS: "5"
      SVS_SAFETY_POLL_SECONDS: "300"
      # reclaim an orphaned copy only after this many days with no source in the mesh
      SVS_RETENTION_DAYS: "7"
      # backfill: 0 = unlimited bandwidth; cap concurrent volume pulls on a joining node
      SVS_BACKFILL_BWLIMIT_KB: "0"
      SVS_BACKFILL_CONCURRENCY: "2"
    volumes:
      # Read own node's volumes + container mounts (am-I-source) and node identity.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read/write the actual volume data for rsync, on every node.
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      # Persist per-node version metadata across agent restarts (outside _data).
      - /var/lib/swarm-volume-sync:/var/lib/swarm-volume-sync
    secrets:
      - svs_ssh_key
      - svs_ssh_pubkey
    networks:
      - svs

networks:
  svs:
    driver: overlay
    attachable: false

secrets:
  svs_ssh_key:
    external: true
  svs_ssh_pubkey:
    external: true
